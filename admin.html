<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Dynamic Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.admin-body { padding-top: 0; }
    .form-group-inline { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media(max-width:540px) { .form-group-inline { grid-template-columns:1fr; } }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
    .toggle-label { font-size:0.82rem; color:var(--ink-soft); }
    .toggle { position:relative; display:inline-block; width:44px; height:24px; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:var(--border); border-radius:24px; cursor:pointer; transition:background var(--t-fast); }
    .toggle-slider::before { content:''; position:absolute; left:3px; top:3px; width:18px; height:18px; background:var(--white); border-radius:50%; transition:transform var(--t-fast); }
    .toggle input:checked + .toggle-slider { background:var(--gold); }
    .toggle input:checked + .toggle-slider::before { transform:translateX(20px); }
    .toggle input:focus-visible + .toggle-slider { outline:2px solid var(--gold); outline-offset:2px; }
    .size-prices-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .size-price-field { display:flex; flex-direction:column; gap:4px; min-width:80px; }
    .size-price-field label { font-size:0.65rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray); }
    .size-price-field input { width:100%; height:36px; padding:0 8px; border:1px solid var(--border); font-size:0.85rem; border-radius:2px; }
  </style>
</head>
<body class="admin-body">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="admin-login">
  <div class="admin-login__card">
    <div class="admin-login__logo">Dynamic<span>.</span></div>
    <p class="admin-login__title">Admin Access</p>
    <form id="loginForm" class="admin-login__form" novalidate>
      <div class="form-group">
        <label for="loginUser" class="form-label">Username <span class="req">*</span></label>
        <input type="text" id="loginUser" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPass" class="form-label">Password <span class="req">*</span></label>
        <input type="password" id="loginPass" class="form-input" required autocomplete="current-password">
      </div>
      <div id="loginError" class="form-error" style="font-size:0.8rem;padding:8px 12px;background:rgba(181,50,42,0.07);border-left:2px solid var(--error);"></div>
      <button type="submit" id="loginBtn" class="btn btn--primary btn--full">Sign In</button>
    </form>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none">

  <!-- Admin nav -->
  <header class="admin-nav">
    <span class="admin-nav__logo">Dynamic<span>.</span></span>
    <div class="admin-nav__tabs">
      <button class="admin-tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="admin-tab-btn" data-tab="products">Products</button>
      <button class="admin-tab-btn" data-tab="orders">Orders</button>
    </div>
    <button class="admin-nav__signout" id="signoutBtn">Sign Out</button>
  </header>

  <main class="admin-main">

    <!-- ── DASHBOARD ────────────────────────────────────── -->
    <div class="admin-tab active" id="tab-dashboard">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-card__label">Total Orders</div>
          <div class="stat-card__val" id="statOrders">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Pending</div>
          <div class="stat-card__val" id="statPending">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Revenue (PKR)</div>
          <div class="stat-card__val stat-card__val--gold" id="statRevenue">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Active Products</div>
          <div class="stat-card__val" id="statProducts">—</div>
        </div>
      </div>

      <div class="admin-section-header">
        <h2 class="admin-section-title">Recent Orders</h2>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="dashboardOrdersTable">
          <thead>
            <tr>
              <th>Ref</th><th>Customer</th><th>City</th><th>Total</th><th>Status</th><th>Date</th>
            </tr>
          </thead>
          <tbody id="dashboardOrdersBody">
            <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── PRODUCTS ──────────────────────────────────────── -->
    <div class="admin-tab" id="tab-products">
      <div class="admin-section-header">
        <h2 class="admin-section-title">Products</h2>
        <button class="btn btn--primary btn--sm" id="addProductBtn">+ Add Product</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="productsTable">
          <thead>
            <tr>
              <th>Name</th><th>Category</th><th>Price</th><th>Badge</th><th>Stock</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsBody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── ORDERS ────────────────────────────────────────── -->
    <div class="admin-tab" id="tab-orders">
      <div class="admin-section-header">
        <h2 class="admin-section-title">All Orders</h2>
      </div>
      <div class="admin-filter" id="orderFilter" role="group" aria-label="Filter orders by status">
        <button class="admin-filter-btn active" data-status="all">All</button>
        <button class="admin-filter-btn" data-status="pending">Pending</button>
        <button class="admin-filter-btn" data-status="confirmed">Confirmed</button>
        <button class="admin-filter-btn" data-status="shipped">Shipped</button>
        <button class="admin-filter-btn" data-status="delivered">Delivered</button>
        <button class="admin-filter-btn" data-status="cancelled">Cancelled</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Ref</th><th>Customer</th><th>Phone</th><th>City</th>
              <th>Payment</th><th>Total</th><th>Status</th><th>Date</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ── PRODUCT MODAL ─────────────────────────────────────── -->
<div class="modal-overlay" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title" id="productModalTitle">Add Product</h2>
      <button class="modal__close" id="modalClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m18 6-12 12M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal__body" id="productModalBody">
      <!-- Injected by JS -->
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="modalCancelBtn">Cancel</button>
      <button class="btn btn--primary" id="modalSaveBtn">Save Product</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="js/data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   ADMIN PANEL SCRIPT
══════════════════════════════════════════════════════════ */
const API = CONFIG.API_BASE;

let token = localStorage.getItem('ds_admin_token') || '';
let allOrders    = [];
let allProducts  = [];
let orderFilter  = 'all';
let editingProductId = null;

/* ── AUTH ──────────────────────────────────────────────── */
function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display  = 'block';
  loadDashboard();
  loadProducts();
  loadOrders();
}

async function verifyToken() {
  if (!token) return false;
  try {
    await apiFetch('/auth/verify', { headers: { Authorization: `Bearer ${token}` } });
    return true;
  } catch { return false; }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  btn.classList.add('btn--loading');
  btn.textContent = '';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    token = data.token;
    localStorage.setItem('ds_admin_token', token);
    showPanel();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.classList.remove('btn--loading');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

document.getElementById('signoutBtn').addEventListener('click', () => {
  token = '';
  localStorage.removeItem('ds_admin_token');
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
});

/* ── TABS ───────────────────────────────────────────────── */
document.querySelectorAll('.admin-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

/* ── AUTH HEADERS ───────────────────────────────────────── */
function authHeaders() { return { Authorization: `Bearer ${token}` }; }

/* ── DASHBOARD ──────────────────────────────────────────── */
async function loadDashboard() {
  try {
    const [orders, products] = await Promise.all([
      apiFetch('/orders', { headers: authHeaders() }),
      apiFetch('/products/all', { headers: authHeaders() }),
    ]);

    document.getElementById('statOrders').textContent   = orders.length;
    document.getElementById('statPending').textContent  = orders.filter(o => o.status === 'pending').length;
    document.getElementById('statRevenue').textContent  = `${(orders.reduce((s,o)=>s+(o.total||0),0)/1000).toFixed(0)}k`;
    document.getElementById('statProducts').textContent = products.filter(p => p.active).length;

    const recent = orders.slice(0, 8);
    document.getElementById('dashboardOrdersBody').innerHTML = recent.length
      ? recent.map(o => `
        <tr>
          <td><code style="font-size:0.78rem">${o.order_ref}</code></td>
          <td>${o.name}</td>
          <td>${o.city}</td>
          <td style="font-weight:500">${fmt(o.total)}</td>
          <td><span class="status-badge status-badge--${o.status}">${o.status}</span></td>
          <td style="color:var(--gray);font-size:0.8rem">${fmtDate(o.created_at)}</td>
        </tr>`).join('')
      : `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray)">No orders yet.</td></tr>`;
  } catch (e) {
    console.error(e);
  }
}

/* ── PRODUCTS ───────────────────────────────────────────── */
async function loadProducts() {
  try {
    allProducts = await apiFetch('/products/all', { headers: authHeaders() });
    renderProductsTable();
  } catch (e) {
    document.getElementById('productsBody').innerHTML =
      `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--error)">${e.message}</td></tr>`;
  }
}

function renderProductsTable() {
  const tbody = document.getElementById('productsBody');
  if (!allProducts.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray)">No products yet.</td></tr>`;
    return;
  }
  tbody.innerHTML = allProducts.map(p => `
    <tr>
      <td style="font-family:var(--font-display);font-size:1rem">${p.name}</td>
      <td style="font-size:0.8rem;color:var(--gray)">${p.piece_type || p.category || '—'}</td>
      <td style="font-weight:500">${fmt(p.base_price)}</td>
      <td>${p.badge ? `<span class="status-badge status-badge--confirmed">${p.badge}</span>` : '—'}</td>
      <td>${p.low_stock ? '<span style="font-size:0.7rem;color:#b5322a;font-weight:500">LOW</span>' : '—'}</td>
      <td><span class="status-badge status-badge--${p.active ? 'confirmed' : 'cancelled'}">${p.active ? 'Active' : 'Hidden'}</span></td>
      <td>
        <button class="btn btn--ghost btn--sm" onclick="openEditProduct(${p.id})" style="margin-right:4px">Edit</button>
        <button class="btn btn--sm" onclick="deleteProduct(${p.id})"
          style="border:1px solid rgba(181,50,42,0.3);color:var(--error);background:rgba(181,50,42,0.05)"
          aria-label="Delete ${p.name}">Delete</button>
      </td>
    </tr>
  `).join('');
}

/* Product modal */
function buildProductForm(product = null) {
  const p = product || {};
  const variants = safe(p.variants) || [{ color:'', price_adj:0, image_url:'', size_prices:{} }];
  const sizes    = safe(p.sizes)    || [{ name:'', price_adj:0 }];

  return `
    <div class="form-grid form-grid--2">
      <div class="form-group form-group--full">
        <label class="form-label" for="pName">Product Name <span class="req">*</span></label>
        <input id="pName" class="form-input" type="text" value="${p.name||''}" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="pBasePrice">Base Price (PKR) <span class="req">*</span></label>
        <input id="pBasePrice" class="form-input" type="number" min="0" value="${p.base_price||0}" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="pCategory">Category</label>
        <input id="pCategory" class="form-input" type="text" value="${p.category||''}">
      </div>
      <div class="form-group">
        <label class="form-label" for="pPieceType">Piece Type</label>
        <select id="pPieceType" class="form-select">
          <option value="">— Select —</option>
          ${['1-piece','2-piece','3-piece','accessories','other'].map(t =>
            `<option value="${t}" ${p.piece_type===t?'selected':''}>${t}</option>`
          ).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="pBadge">Badge</label>
        <select id="pBadge" class="form-select">
          <option value="">None</option>
          ${['New','Sale','Hot','Limited'].map(b =>
            `<option value="${b}" ${p.badge===b?'selected':''}>${b}</option>`
          ).join('')}
        </select>
      </div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Low Stock Warning</span>
      <label class="toggle">
        <input type="checkbox" id="pLowStock" ${p.low_stock?'checked':''}>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Active (visible in shop)</span>
      <label class="toggle">
        <input type="checkbox" id="pActive" ${p.active!==false?'checked':''}>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Colour Variants -->
    <div>
      <p class="form-section__title" style="font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        Colour Variants
      </p>
      <div class="variant-list" id="variantList">
        ${variants.map((v, i) => buildVariantRow(v, i)).join('')}
      </div>
      <button type="button" class="btn btn--ghost btn--sm" style="margin-top:12px" onclick="addVariantRow()">+ Add Colour</button>
    </div>

    <!-- Sizes -->
    <div>
      <p class="form-section__title" style="font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        Sizes
      </p>
      <div class="variant-list" id="sizeList">
        ${sizes.map((s, i) => buildSizeRow(s, i)).join('')}
      </div>
      <button type="button" class="btn btn--ghost btn--sm" style="margin-top:12px" onclick="addSizeRow()">+ Add Size</button>
    </div>
  `;
}

function buildVariantRow(v = {}, i) {
  const sp = v.size_prices || {};
  return `
    <div class="variant-item" id="variant-${i}">
      <div class="variant-item__header">
        <span class="variant-item__label">Variant ${i+1}</span>
        <button type="button" class="variant-item__remove" onclick="removeRow('variant-${i}')">Remove</button>
      </div>
      <div class="variant-grid variant-grid--3">
        <div class="form-group">
          <label class="form-label">Colour Name</label>
          <input type="text" class="form-input v-color" value="${v.color||''}" placeholder="e.g. Black">
        </div>
        <div class="form-group">
          <label class="form-label">Price Adj (PKR)</label>
          <input type="number" class="form-input v-price-adj" value="${v.price_adj||0}">
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input type="url" class="form-input v-img" value="${v.image_url||''}" placeholder="https://...">
        </div>
      </div>
    </div>`;
}

function buildSizeRow(s = {}, i) {
  return `
    <div class="variant-item" id="size-${i}">
      <div class="variant-item__header">
        <span class="variant-item__label">Size ${i+1}</span>
        <button type="button" class="variant-item__remove" onclick="removeRow('size-${i}')">Remove</button>
      </div>
      <div class="variant-grid">
        <div class="form-group">
          <label class="form-label">Size Name</label>
          <input type="text" class="form-input s-name" value="${s.name||''}" placeholder="XS, S, M, L, XL">
        </div>
        <div class="form-group">
          <label class="form-label">Price Adj (PKR)</label>
          <input type="number" class="form-input s-price" value="${s.price_adj||0}">
        </div>
      </div>
    </div>`;
}

let variantCount = 0;
let sizeCount    = 0;

function addVariantRow() {
  const list = document.getElementById('variantList');
  const i = ++variantCount + 100;
  const div = document.createElement('div');
  div.innerHTML = buildVariantRow({}, i);
  list.appendChild(div.firstElementChild);
}

function addSizeRow() {
  const list = document.getElementById('sizeList');
  const i = ++sizeCount + 100;
  const div = document.createElement('div');
  div.innerHTML = buildSizeRow({}, i);
  list.appendChild(div.firstElementChild);
}

function removeRow(id) {
  document.getElementById(id)?.remove();
}

function openAddProduct() {
  editingProductId = null;
  document.getElementById('productModalTitle').textContent = 'Add Product';
  document.getElementById('productModalBody').innerHTML = buildProductForm();
  openModal();
}

function openEditProduct(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  editingProductId = id;
  document.getElementById('productModalTitle').textContent = 'Edit Product';
  document.getElementById('productModalBody').innerHTML = buildProductForm(p);
  openModal();
}

function openModal() {
  const overlay = document.getElementById('productModal');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('pName').focus();
}

function closeModal() {
  document.getElementById('productModal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
document.getElementById('addProductBtn').addEventListener('click', openAddProduct);
document.getElementById('productModal').addEventListener('click', e => {
  if (e.target === document.getElementById('productModal')) closeModal();
});

document.getElementById('modalSaveBtn').addEventListener('click', async () => {
  const nameEl = document.getElementById('pName');
  if (!nameEl?.value.trim()) { toast('Product name is required.', 'error'); return; }

  // Collect variants
  const variants = [...document.querySelectorAll('.variant-item[id^="variant"]')].map(el => ({
    color:     el.querySelector('.v-color')?.value.trim() || '',
    price_adj: parseFloat(el.querySelector('.v-price-adj')?.value || 0),
    image_url: el.querySelector('.v-img')?.value.trim()    || '',
    size_prices: {},
  })).filter(v => v.color);

  // Collect sizes
  const sizes = [...document.querySelectorAll('.variant-item[id^="size"]')].map(el => ({
    name:      el.querySelector('.s-name')?.value.trim()  || '',
    price_adj: parseFloat(el.querySelector('.s-price')?.value || 0),
  })).filter(s => s.name);

  const body = {
    name:       nameEl.value.trim(),
    base_price: parseInt(document.getElementById('pBasePrice').value || 0),
    category:   document.getElementById('pCategory').value.trim(),
    piece_type: document.getElementById('pPieceType').value,
    badge:      document.getElementById('pBadge').value || null,
    low_stock:  document.getElementById('pLowStock').checked,
    active:     document.getElementById('pActive').checked,
    variants,
    sizes,
    pieces: [],
  };

  const btn = document.getElementById('modalSaveBtn');
  btn.classList.add('btn--loading');
  btn.textContent = '';
  btn.disabled = true;

  try {
    if (editingProductId) {
      await apiFetch(`/products/${editingProductId}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(body),
      });
      toast('Product updated.', 'success');
    } else {
      await apiFetch('/products', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body),
      });
      toast('Product added.', 'success');
    }
    closeModal();
    loadProducts();
  } catch (e) {
    toast(e.message, 'error');
  }

  btn.classList.remove('btn--loading');
  btn.disabled = false;
  btn.textContent = 'Save Product';
});

async function deleteProduct(id) {
  const p = allProducts.find(x => x.id === id);
  if (!confirm(`Delete "${p?.name}"? This will hide it from the shop.`)) return;
  try {
    await apiFetch(`/products/${id}`, { method: 'DELETE', headers: authHeaders() });
    toast('Product deleted.', 'info');
    loadProducts();
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* ── ORDERS ──────────────────────────────────────────────── */
async function loadOrders() {
  try {
    allOrders = await apiFetch('/orders', { headers: authHeaders() });
    renderOrdersTable();
  } catch (e) {
    document.getElementById('ordersBody').innerHTML =
      `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--error)">${e.message}</td></tr>`;
  }
}

function renderOrdersTable() {
  const tbody = document.getElementById('ordersBody');
  const filtered = orderFilter === 'all' ? allOrders : allOrders.filter(o => o.status === orderFilter);

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray)">No orders.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(o => `
    <tr>
      <td><code style="font-size:0.78rem">${o.order_ref}</code></td>
      <td>${o.name}</td>
      <td style="font-size:0.8rem">${o.phone}</td>
      <td style="font-size:0.8rem">${o.city}</td>
      <td style="font-size:0.8rem">${o.payment}</td>
      <td style="font-weight:500">${fmt(o.total)}</td>
      <td>
        <select class="status-select" data-ref="${o.order_ref}" aria-label="Update status for ${o.order_ref}">
          ${['pending','confirmed','shipped','delivered','cancelled'].map(s =>
            `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`
          ).join('')}
        </select>
      </td>
      <td style="color:var(--gray);font-size:0.8rem">${fmtDate(o.created_at)}</td>
    </tr>
  `).join('');

  tbody.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      try {
        await apiFetch(`/orders/${sel.dataset.ref}/status`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ status: sel.value }),
        });
        toast(`Order ${sel.dataset.ref} → ${sel.value}`, 'success');
        loadOrders();
        loadDashboard();
      } catch (e) {
        toast(e.message, 'error');
      }
    });
  });
}

document.querySelectorAll('#orderFilter .admin-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    orderFilter = btn.dataset.status;
    document.querySelectorAll('#orderFilter .admin-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOrdersTable();
  });
});

/* ── UTILS ──────────────────────────────────────────────── */
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

/* ── INIT ───────────────────────────────────────────────── */
(async () => {
  if (token && await verifyToken()) {
    showPanel();
  }
})();
</script>
</body>
</html>
